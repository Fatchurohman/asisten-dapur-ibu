<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Olahan Kuliner Kompleks</title>
  <style>
    :root {
      --primary-color: #0d9488;
      --primary-hover: #0f766e;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-color);
    }

    .table-container {
      background-color: var(--card-bg);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      background-color: #ccfbf1;
      color: #115e59;
    }

    .empty-state, .error-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
    }

    .error-state {
      color: #b91c1c;
      background-color: #fef2f2;
    }

    @media (max-width: 640px) {
      th, td {
        padding: 0.75rem 0.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="app-title">Katalog Olahan Kuliner</h1>
      <p id="app-subtitle">Memuat data olahan bahan makanan...</p>
    </header>

    <div class="controls">
      <input type="text" id="search-input" class="search-input" placeholder="Cari nama olahan atau kategori...">
    </div>

    <div class="table-container">
      <table id="recipes-table">
        <thead>
          <tr>
            <th style="width: 60px;">No.</th>
            <th>Nama Olahan</th>
            <th>Kategori</th>
            <th>Ringkasan Olahan</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Data dinamis dimasukkan lewat JS -->
        </tbody>
      </table>
      <div id="status-message"></div>
    </div>
  </div>

  <script>
    // Data JSON lokal dengan validasi aman dan isi komprehensif (20 items)
    const rawIngredientsData = JSON.stringify({
      ingredient: "Tahu",
      totalItems: 20,
      items: [
        { id: 1, name: "Tahu Goreng Crispy", category: "Camilan", description: "Tahu balok dibalut tepung berbumbu gurih dan digoreng renyah." },
        { id: 2, name: "Tahu Isi / Tahu Jeletot", category: "Camilan", description: "Tahu kulit diisi sayuran tumis, bihun, atau tumisan cabai ekstra pedas." },
        { id: 3, name: "Tahu Walik", category: "Camilan", description: "Tahu dibalik, diisi adonan bakso ayam/sapi, lalu digoreng garing." },
        { id: 4, name: "Tahu Bacem", category: "Lauk Tradisional", description: "Tahu direbus dalam bumbu gula merah, ketumbar, dan air kelapa lalu digoreng pelan." },
        { id: 5, name: "Tahu Telur (Tahu Tek)", category: "Main Course", description: "Tahu dikocok bersama telur, digoreng, disajikan dengan lontong dan bumbu kacang petis." },
        { id: 6, name: "Tahu Gimbal", category: "Main Course", description: "Tahu goreng disajikan bersama gimbal udang, kol, lontong, dan kuah kacang encer." },
        { id: 7, name: "Tahu Campur", category: "Main Course", description: "Tahu goreng disajikan dalam kuah kaldu sapi gurih khas Jawa Timur dengan kikil dan selada." },
        { id: 8, name: "Pepes Tahu", category: "Lauk Sehat", description: "Tahu dihancurkan, dicampur bumbu halus dan kemangi, dibungkus daun pisang lalu dikukus/dibakar." },
        { id: 9, name: "Tumis Tahu Tauge", category: "Masakan Harian", description: "Tahu sutra atau tahu putih ditumis cepat bersama tauge, kecap manis, dan bawang." },
        { id: 10, name: "Tahu Gejrot", category: "Cirebonan", description: "Tahu pong dipotong-potong, disiram kuah asam-manis-pedas dari gula merah dan ulekan cabai mentah." },
        { id: 11, name: "Tahu Petis", category: "Camilan khas Semarang", description: "Tahu pong goreng panas yang disisipi bumbu petis hitam gurih manis." },
        { id: 12, name: "Tahu Cabai Garam", category: "Oriental / Cafe", description: "Tahu sutra potong dadu, digoreng renyah lalu ditumis bersama cincangan cabai, bawang putih, dan daun bawang." },
        { id: 13, name: "Sapo Tahu", category: "Masakan Resto", description: "Tahu telur (egg tofu) dimasak kuah kental gurih bersama sayuran dan seafood/daging." },
        { id: 14, name: "Sup Tahu Bening", category: "Sup Bening", description: "Tahu putih dipotong dadu dimasak kuah bening bersama daun bawang dan minyak wijen." },
        { id: 15, name: "Mun Tahu", category: "Masakan Tionghoa", description: "Tahu lembut dicincang halus, dimasak kuah kental berbasis kaldu ayam dan daging giling." },
        { id: 16, name: "Perkedel Tahu", category: "Lauk Pendamping", description: "Tahu dihaluskan bersama telur, bawang goreng, dan daun seledri, dibentuk bulat lalu digoreng." },
        { id: 17, name: "Tahu Fantasi", category: "Camilan Olahan", description: "Tahu halus dicampur telur dan bihun, dicetak dalam cetakan bunga, diberi sosis di tengah, lalu dikukus dan digoreng." },
        { id: 18, name: "Rendang Tahu", category: "Lauk Kaya Rempah", description: "Tahu dimasak dalam bumbu rendang bersantan hingga bumbu meresap sempurna." },
        { id: 19, name: "Kering Tahu / Orek Tahu", category: "Lauk Awetan", description: "Tahu dipotong tipis kecil, digoreng garing, lalu ditumis bumbu asam manis gurih pedas." },
        { id: 20, name: "Bola-Bola Tahu Keju", category: "Camilan Modern", description: "Tahu halus diisi keju meleh (mozzarella/cheddar), dibalur tepung roti, lalu digoreng hingga kuning keemasan." }
      ]
    });

    let globalItemsList = [];

    // Parsing data aman dengan penanganan error
    function parseJSONSafely(jsonString) {
      try {
        if (!jsonString || typeof jsonString !== 'string') {
          throw new Error("Data JSON tidak valid atau kosong.");
        }
        const parsed = JSON.parse(jsonString);
        
        // Validasi struktur objek
        if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.items)) {
          throw new Error("Struktur data JSON tidak lengkap atau format 'items' bukan array.");
        }
        
        return { success: true, data: parsed };
      } catch (error) {
        return { success: false, error: error.message };
      }
    }

    // Sanitisasi String HTML
    function escapeHTML(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Render Tabel ke DOM
    function renderTable(items) {
      const tableBody = document.getElementById('table-body');
      const statusMessage = document.getElementById('status-message');
      
      tableBody.innerHTML = '';
      statusMessage.innerHTML = '';

      if (!Array.isArray(items) || items.length === 0) {
        statusMessage.innerHTML = '<div class="empty-state">Tidak ada data olahan yang ditemukan.</div>';
        return;
      }

      const rowsHTML = items.map((item, index) => {
        const safeName = escapeHTML(item.name || 'Tanpa Nama');
        const safeCategory = escapeHTML(item.category || 'Umum');
        const safeDescription = escapeHTML(item.description || '-');

        return `
          <tr>
            <td><strong>${index + 1}</strong></td>
            <td><strong>${safeName}</strong></td>
            <td><span class="badge">${safeCategory}</span></td>
            <td>${safeDescription}</td>
          </tr>
        `;
      }).join('');

      tableBody.innerHTML = rowsHTML;
    }

    // Filter Pencarian
    function setupSearch(items) {
      const searchInput = document.getElementById('search-input');
      
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        
        const filteredItems = items.filter(item => {
          const name = (item.name || '').toLowerCase();
          const category = (item.category || '').toLowerCase();
          const description = (item.description || '').toLowerCase();
          
          return name.includes(query) || category.includes(query) || description.includes(query);
        });

        renderTable(filteredItems);
      });
    }

    // Inisialisasi Aplikasi
    function initApp() {
      const appTitle = document.getElementById('app-title');
      const appSubtitle = document.getElementById('app-subtitle');
      const statusMessage = document.getElementById('status-message');

      const result = parseJSONSafely(rawIngredientsData);

      if (!result.success) {
        statusMessage.innerHTML = `<div class="error-state">Gagal memuat data: ${escapeHTML(result.error)}</div>`;
        appSubtitle.textContent = "Terjadi kesalahan sistem.";
        return;
      }

      const { ingredient, totalItems, items } = result.data;
      globalItemsList = items;

      appTitle.textContent = `20 Variasi Olahan Kuliner Berbahan ${escapeHTML(ingredient)}`;
      appSubtitle.textContent = `Menampilkan total ${totalItems} resep masakan dan camilan realistis.`;

      renderTable(globalItemsList);
      setupSearch(globalItemsList);
    }

    // Jalankan aplikasi setelah DOM siap
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
