<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Olahan Kuliner</title>
  <style>
    :root {
      --primary-color: #0d9488;
      --primary-hover: #0f766e;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header & Identitas Awal */
    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .app-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .app-logo {
      width: 42px;
      height: 42px;
      background-color: var(--primary-color);
      color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.3);
    }

    header h1 {
      font-size: 2rem;
      color: var(--primary-color);
    }

    header p {
      color: var(--text-muted);
    }

    /* Control & Form Input */
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-color);
    }

    .btn-search {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-search:hover {
      background-color: var(--primary-hover);
    }

    /* Container Tabel Awal */
    .table-container {
      background-color: var(--card-bg);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      background-color: #ccfbf1;
      color: #115e59;
    }

    .btn-action {
      background-color: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0.4rem 0.8rem;
      border-radius: 0.375rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-action:hover {
      background-color: var(--primary-color);
      color: white;
    }

    .empty-state, .error-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
    }

    .error-state {
      color: #b91c1c;
      background-color: #fef2f2;
    }

    /* Pop-up Modal Cara Memasak */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      border-radius: 0.75rem;
      padding: 1.75rem;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .modal-title {
      font-size: 1.35rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.75rem;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 1.25rem 0 0.5rem 0;
      color: var(--primary-color);
    }

    .steps-list {
      padding-left: 1.25rem;
    }

    .steps-list li {
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    @media (max-width: 640px) {
      th, td {
        padding: 0.75rem 0.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="app-brand">
        <div class="app-logo">🍳</div>
        <h1 id="app-title">Katalog Olahan Kuliner</h1>
      </div>
      <p id="app-subtitle">Memuat data olahan resep masakan...</p>
    </header>

    <div class="controls">
      <input type="text" id="search-input" class="search-input" placeholder="Ketik bahan dasar (contoh: Tahu, Ayam, Jagung, Udang, Telur)..." value="Tahu">
      <button id="btn-search" class="btn-search">Cari Resep</button>
    </div>

    <div class="table-container">
      <table id="recipes-table">
        <thead>
          <tr>
            <th style="width: 50px;">No.</th>
            <th>Nama Olahan</th>
            <th>Kategori</th>
            <th>Ringkasan Olahan</th>
            <th style="text-align: center; width: 140px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Data dinamis disuntikkan via JavaScript -->
        </tbody>
      </table>
      <div id="status-message"></div>
    </div>
  </div>

  <!-- Modal Cara Memasak -->
  <div class="modal-overlay" id="recipe-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <span class="badge" id="modal-badge">Kategori</span>
          <h2 class="modal-title" id="modal-title" style="margin-top: 0.35rem;">Nama Resep</h2>
        </div>
        <button class="btn-close" id="btn-close-modal">&times;</button>
      </div>
      <p id="modal-desc" style="color: var(--text-muted); font-size: 0.95rem;"></p>
      
      <div class="section-title">Cara Memasak (Langkah Detail):</div>
      <ol class="steps-list" id="modal-steps">
        <!-- Detail langkah disuntikkan via JS -->
      </ol>
    </div>
  </div>

  <script>
    // Database Kuliner Diperkaya (20 Resep untuk Tahu, Jagung, Ayam, Udang, Telur)
    const databaseJSON = JSON.stringify({
      "tahu": {
        ingredient: "Tahu",
        items: [
          { name: "Tahu Goreng Crispy", category: "Camilan", description: "Tahu balok dibalut tepung berbumbu gurih dan digoreng renyah.", steps: ["Potong tahu putih ukuran dadu sedang.", "Rendam dalam air garam dan ulekan bawang putih selama 10 menit.", "Balurkan ke campuran tepung terigu dan maizena.", "Goreng dalam minyak panas melimpah hingga kuning keemasan dan garing."] },
          { name: "Tahu Isi / Tahu Jeletot", category: "Camilan", description: "Tahu kulit diisi sayuran tumis, bihun, atau tumisan cabai ekstra pedas.", steps: ["Gunting satu sisi tahu kulit garing.", "Tumis wortel, tauge, dan ulekan cabai rawit pedas.", "Isikan tumisan sayur ke dalam tahu.", "Celupkan ke adonan tepung encer lalu goreng hingga garing."] },
          { name: "Tahu Walik", category: "Camilan", description: "Tahu dibalik, diisi adonan bakso ayam/sapi, lalu digoreng garing.", steps: ["Potong tahu pong secara diagonal, balik bagian dalam ke luar.", "Campur daging ayam giling, tepung tapioka, dan bumbu halus.", "Isikan adonan bakso ke dalam tahu yang sudah dibalik.", "Goreng dengan api sedang hingga matang merata."] },
          { name: "Tahu Bacem", category: "Lauk Tradisional", description: "Tahu direbus dalam bumbu gula merah, ketumbar, dan air kelapa.", steps: ["Haluskan bawang merah, bawang putih, ketumbar, dan kemiri.", "Ungkep tahu bersama air kelapa, bumbu halus, gula merah, dan asam jawa.", "Rebus hingga kuah menyusut dan bumbu meresap sempurna.", "Goreng sebentar dalam minyak panas sebelum disajikan."] },
          { name: "Tahu Telur (Tahu Tek)", category: "Main Course", description: "Tahu dikocok bersama telur, disajikan dengan bumbu kacang petis.", steps: ["Kocok telur bersama potong dadu tahu dan sedikit garam.", "Goreng dadar tahu telur hingga berkulit renyah.", "Ulek kacang tanah goreng, petis udang, cabai, dan air asam jawa.", "Tata tahu telur di atas lontong, siram bumbu kacang petis dan tauge."] },
          { name: "Tahu Gimbal", category: "Main Course", description: "Tahu disajikan bersama gimbal udang, kol, dan kuah kacang encer.", steps: ["Goreng tahu putih dan buat bakwan udang (gimbal).", "Iris halus kol segar dan potong-potong lontong.", "Tata seluruh bahan di piring saji.", "Siram kuah kacang petis encer, taburi bawang goreng dan kerupuk."] },
          { name: "Tahu Campur", category: "Main Course", description: "Kuliner berkuah kaldu sapi gurih khas Jawa Timur dengan kikil.", steps: ["Rebus kikil sapi bersama rempah-rempah hingga empuk.", "Racik petis halus di dasar piring.", "Tambahkan tahu goreng, lontong, mi kuning, dan daun selada.", "Siram dengan kuah kaldu sapi hangat."] },
          { name: "Pepes Tahu Kemangi", category: "Lauk Sehat", description: "Tahu dihancurkan, dicampur bumbu halus dan kemangi, dikukus.", steps: ["Haluskan tahu putih, tiriskan sisa airnya.", "Campur dengan kocokan telur, irisan cabai, bumbu halus, dan daun kemangi.", "Bungkus adonan dengan daun pisang secara rapat.", "Kukus selama 20 menit lalu bakar sebentar di atas teflon."] },
          { name: "Tumis Tahu Tauge", category: "Masakan Harian", description: "Tahu sutra atau tahu putih ditumis cepat bersama tauge.", steps: ["Potong tahu dadu, goreng setengah matang.", "Tumis bawang merah, bawang putih, dan irisan cabai hingga harum.", "Masukkan tauge dan tahu goreng.", "Bumbui saus tiram, kecap manis, dan lada. Tumis cepat agar tauge tetap renyah."] },
          { name: "Tahu Gejrot", category: "Cirebonan", description: "Tahu pong dipotong-potong, disiram kuah asam-manis-pedas.", steps: ["Potong-potong tahu pong goreng garing.", "Ulek kasar cabai rawit, bawang merah, bawang putih, dan garam.", "Seduh ulekan dengan air rebusan gula merah dan asam jawa.", "Siramkan kuah beserta ulekan bumbu di atas tahu."] },
          { name: "Tahu Petis", category: "Camilan khas Semarang", description: "Tahu pong goreng panas yang disisipi bumbu petis hitam gurih manis.", steps: ["Goreng tahu pong hingga garing dan melar.", "Tumis petis udang bersama bawang putih halus dan sedikit air hingga kental.", "Belah tengah tahu pong panas, selipkan bumbu petis manis gurih."] },
          { name: "Tahu Cabai Garam", category: "Oriental / Cafe", description: "Tahu sutra potong dadu, digoreng renyah ditumis cabai bawang.", steps: ["Potong tahu sutra dadu, baluri tepung maizena kering.", "Goreng hingga krispi dan tiriskan.", "Cincang halus bawang putih dan cabai rawit merah.", "Tumis bawang dan cabai hingga wangi, masukkan tahu dan beri garam secukupnya."] },
          { name: "Sapo Tahu", category: "Masakan Resto", description: "Tahu telur (egg tofu) dimasak kuah kental gurih bersama sayuran.", steps: ["Potong tofu melingkar, balur maizena, goreng hingga berkulit.", "Tumis bawang bombai, jahe, dan udang/ayam.", "Masukkan wortel, pokcoy, dan jamur.", "Bumbui saus tiram dan kecap asin, kentalkan dengan larutan maizena."] },
          { name: "Sup Tahu Bening", category: "Sup Bening", description: "Tahu putih dipotong dadu dimasak kuah bening minyak wijen.", steps: ["Didihkan air kaldu ayam.", "Masukkan potongan tahu putih halus dan daun sawi.", "Bumbui dengan garam, merica, dan tetesan minyak wijen.", "Taburi daun bawang dan bawang putih goreng."] },
          { name: "Mun Tahu", category: "Masakan Tionghoa", description: "Tahu lembut dicincang halus dimasak kuah kental daging giling.", steps: ["Tumis bawang putih halus dan daging ayam/sapi cincang.", "Tuang air kaldu, masukkan tahu sutra yang dihancurkan lembut.", "Bumbui saus tiram, kecap asin, dan daun bawang.", "Kentalkan kuah dengan larutan tepung tapioka."] },
          { name: "Perkedel Tahu", category: "Lauk Pendamping", description: "Tahu dihaluskan bersama telur dan seledri, dibentuk bulat digoreng.", steps: ["Haluskan tahu putih lalu peras airnya menggunakan kain bersih.", "Campur dengan telur, irisan seledri, bawang goreng, dan lada.", "Bentuk bulat pipih.", "Balur kocokan telur lalu goreng hingga kuning keemasan."] },
          { name: "Tahu Fantasi", category: "Camilan Olahan", description: "Tahu halus dicampur bihun, dicetak dalam mangkuk, diberi sosis.", steps: ["Haluskan tahu, campur bihun rebus, wortel serut, dan telur.", "Bumbui garam, lada, dan kaldu bubuk.", "Cetak dalam cetakan kue mangkuk, tancapkan sosis di tengahnya.", "Kukus hingga matang lalu goreng sebentar."] },
          { name: "Rendang Tahu", category: "Lauk Kaya Rempah", description: "Tahu dimasak dalam bumbu rendang bersantan hingga meresap.", steps: ["Goreng tahu putih hingga berkulit tebal.", "Tumis bumbu halus rendang bersama daun kunyit, serai, dan daun jeruk.", "Tuang santan encer dan masukkan tahu.", "Masak dengan api kecil hingga santan berminyak dan bumbu meresap."] },
          { name: "Kering Tahu / Orek Tahu", category: "Lauk Awetan", description: "Tahu dipotong tipis kecil, digoreng garing ditumis bumbu asam manis.", steps: ["Potong tahu tipis korek api, goreng hingga garing renyah.", "Tumis gula merah, air asam jawa, irisan cabai, dan bawang hingga berserabut.", "Masukkan tahu garing, aduk cepat hingga semua tahu terbalut bumbu."] },
          { name: "Bola-Bola Tahu Keju", category: "Camilan Modern", description: "Tahu halus diisi keju meleleh, dibalur tepung roti lalu digoreng.", steps: ["Haluskan tahu, campur dengan sedikit tepung terigu dan lada.", "Ambil adonan, isi dengan potongan keju mozzarella/cheddar.", "Bentuk bola, gulingkan di tepung panir/roti.", "Goreng dalam minyak panas hingga renyah."] }
        ]
      },
      "jagung": {
        ingredient: "Jagung",
        items: [
          { name: "Bakwan Jagung Crispy", category: "Camilan", description: "Dadar jagung manis renyah gurih dengan daun jeruk.", steps: ["Sisir jagung manis.", "Campur tepung terigu, tepung beras, iris daun jeruk, dan bumbu halus.", "Tambahkan air secukupnya.", "Goreng dalam minyak panas hingga garing."] },
          { name: "Jasuke (Jagung Susu Keju)", category: "Camilan Modern", description: "Jagung manis kukus hangat disiram mentega, susu, dan keju melimpah.", steps: ["Kukus pipilan jagung manis hingga empuk.", "Pindahkan ke wadah selagi panas.", "Aduk rata dengan mentega, siram susu kental manis, dan keju parut."] },
          { name: "Sup Jagung Telur Kental", category: "Sup", description: "Sup jagung manis hangat bertekstur kental halus.", steps: ["Rebus pipilan jagung bersama air kaldu ayam.", "Bumbui garam, lada, dan sedikit minyak wijen.", "Kocok telur, tuang pelan sambil diacak melingkar.", "Kentalkan dengan larutan maizena."] },
          { name: "Lepet Jagung", category: "Jajanan Pasar", description: "Kue jagung kukus kelapa parut dibungkus klobot jagung.", steps: ["Parut atau blender kasar jagung manis.", "Campur kelapa parut muda, gula pasir, dan sedikit vanili.", "Bungkus adonan dengan klobot jagung.", "Kukus selama 30 menit hingga matang."] },
          { name: "Tumis Jagung Putren Bakso", category: "Masakan Harian", description: "Tumisan renyah jagung muda dan bakso sapi saus tiram.", steps: ["Potong serong jagung putren dan bakso.", "Tumis bawang putih dan cabai merah hingga wangi.", "Masukkan jagung muda dan sedikit air.", "Bumbui saus tiram dan masak sebentar agar tetap renyah."] },
          { name: "Nasi Jagung Tradisional", category: "Makanan Pokok", description: "Beras jagung kukus pendamping lauk pauk dan urap.", steps: ["Rendam beras jagung selama 2 jam.", "Kukus beras jagung setengah matang, siram sedikit air hangat.", "Kukus kembali hingga empuk dan tanak.", "Sajikan hangat bersama urap dan ikan asin."] },
          { name: "Puding Jagung Manis", category: "Pencuci Mulut", description: "Puding lembut dari sari jagung manis murni dan santan.", steps: ["Blender jagung manis dengan air lalu saring sarinya.", "Campur sari jagung, bubuk agar-agar, santan, dan gula pasir.", "Rebus hingga mendidih sambil diaduk.", "Tuang ke cetakan dan dinginkan."] },
          { name: "Bubur Jagung Manis (Barobbo)", category: "Kuliner Daerah", description: "Bubur jagung khas Sulawesi dengan irisan sayur segar.", steps: ["Rebus jagung manis pipil bersama air hingga lunak.", "Haluskan sebagian jagung untuk tekstur kental.", "Masukkan daun bayam, kangkung, dan kemangi.", "Bumbui bawang putih dan merica, sajikan panas."] },
          { name: "Jagung Bakar Pedas Manis", category: "Camilan Malam", description: "Jagung utuh dibakar dengan olesan mentega, madu, dan saus cabai.", steps: ["Bersihkan jagung utuh dari rambutnya.", "Campur mentega leleh, saus sambal, dan madu.", "Olesi jagung lalu bakar di atas arang/teflon sambil terus diolesi.", "Bakar hingga permukaan agak sedikit karamel."] },
          { name: "Es Jagung Hawai", category: "Minuman Segar", description: "Minuman es jagung kental manis dengan jelly dan kuah santan.", steps: ["Rebus jagung manis dengan gula hingga kental berkaldu.", "Siapkan gelas, beri es batu dan potongan jelly.", "Masukkan olahan jagung manis kental.", "Siram dengan kuah santan gurih."] },
          { name: "Sambal Goreng Jagung Manis", category: "Lauk Pedas", description: "Pipilan jagung ditumis bumbu balado pedas manis.", steps: ["Goreng sebentar pipilan jagung manis.", "Tumis bumbu halus balado (cabai, bawang, tomat) hingga harum.", "Masukkan jagung pipil, beri gula merah dan garam.", "Masak hingga bumbu meresap."] },
          { name: "Tumis Jagung Manis Buncis", category: "Masakan Sehat", description: "Kombinasi manis renyah jagung pipil dan irisan buncis.", steps: ["Potong buncis ukuran kecil-kecil.", "Tumis bawang merah dan bawang putih iris.", "Masukkan jagung pipil dan buncis bersamaan.", "Bumbui garam dan kaldu jamur, masak cepat."] },
          { name: "Nugget Jagung", category: "Camilan Praktis", description: "Olahan jagung giling dibalur tepung roti goreng renyah.", steps: ["Haluskan jagung manis, campur dengan terigu, telur, dan seledri.", "Kukus adonan dalam loyang hingga padat.", "Potong-potong, balurkan tepung panir.", "Goreng hingga keemasan."] },
          { name: "Perkedel Jagung Daging Cincang", category: "Lauk Mewah", description: "Perkedel jagung padat gurih campuran daging sapi.", steps: ["Tumbuk kasar jagung manis.", "Campur dengan daging sapi cincang, telur, dan bumbu halus.", "Bentuk bulat pipih.", "Goreng dengan api sedang hingga matang merata."] },
          { name: "Cream Soup Jagung Ayam", category: "Sup Barat", description: "Sup krim jagung manis kental gurih khas restoran.", steps: ["Tumis bawang bombai dan mentega hingga harum.", "Masukkan tepung terigu, tuang susu cair bertahap.", "Masukkan jagung pipil dan suwiran ayam.", "Bumbui oregano, lada putih, dan garam."] },
          { name: "Ayam Saus Padang Jagung Manis", category: "Main Course", description: "Potongan ayam dan potongan jagung manis dalam kuah pedas Padang.", steps: ["Potong jagung manis menjadi beberapa bagian melingkar.", "Rebus jagung hingga setengah matang.", "Tumis bumbu saus Padang pedas gurih.", "Masukkan ayam goreng dan potongan jagung manis."] },
          { name: "Botok Jagung", category: "Lauk Kukus", description: "Jagung parut campur kelapa parut dibungkus daun pisang.", steps: ["Campur jagung parut, kelapa muda parut, dan cabai potong.", "Bumbui dengan bawang putih, kencur, dan daun salam.", "Bungkus rapat dengan daun pisang.", "Kukus selama 25 menit."] },
          { name: "Tahu Sutra Siram Jagung Manis", category: "Olahan Sehat", description: "Tahu kukus lembut disiram tumisan jagung manis cincang.", steps: ["Kukus tahu sutra hingga hangat.", "Tumis bawang putih dan pipilan jagung manis.", "Bumbui saus tiram dan minyak wijen, kentalkan sedikit maizena.", "Siramkan di atas tahu sutra."] },
          { name: "Keripik Jagung (Tortilla Chips)", category: "Camilan Renyah", description: "Keripik jagung renyah khas olahan tepung jagung.", steps: ["Campur tepung jagung murni, sedikit terigu, air, dan garam.", "Uleni hingga kalis, giling tipis, dan potong segitiga.", "Goreng dalam minyak panas hingga sangat renyah.", "Taburi bumbu balado atau keju."] },
          { name: "Nasi Goreng Jagung Manis", category: "Variasi Nasi Goreng", description: "Nasi goreng gurih dengan sensasi manis renyah jagung pipil.", steps: ["Tumis bumbu halus nasi goreng.", "Masukkan jagung pipil segar dan sedikit telur orak-arik.", "Masukkan nasi putih dingin, aduk rata di atas api besar.", "Bumbui kecap asin dan daun bawang."] }
        ]
      },
      "ayam": {

    let currentDataSet = [];

    // Parsing JSON Aman
    function parseJSONSafely(str) {
      try {
        if (!str) throw new Error("Data JSON kosong.");
        const parsed = JSON.parse(str);
        return { success: true, data: parsed };
      } catch (err) {
        return { success: false, error: err.message };
      }
    }

    // Sanitisasi String HTML
    function escapeHTML(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Render Tabel Utama
    function renderTable(items) {
      const tableBody = document.getElementById('table-body');
      const statusMessage = document.getElementById('status-message');
      
      tableBody.innerHTML = '';
      statusMessage.innerHTML = '';

      if (!Array.isArray(items) || items.length === 0) {
        statusMessage.innerHTML = '<div class="empty-state">Tidak ada resep yang ditemukan untuk bahan ini. Coba ketik "Tahu", "Jagung", "Ayam", "Udang", atau "Telur".</div>';
        return;
      }

      const rowsHTML = items.map((item, index) => {
        const safeName = escapeHTML(item.name || 'Tanpa Nama');
        const safeCategory = escapeHTML(item.category || 'Umum');
        const safeDescription = escapeHTML(item.description || '-');

        return `
          <tr>
            <td><strong>${index + 1}</strong></td>
            <td><strong>${safeName}</strong></td>
            <td><span class="badge">${safeCategory}</span></td>
            <td>${safeDescription}</td>
            <td style="text-align: center;">
              <button class="btn-action" onclick="showRecipeDetail(${index})">Cara Memasak</button>
            </td>
          </tr>
        `;
      }).join('');

      tableBody.innerHTML = rowsHTML;
    }

    // Buka Modal Cara Memasak
    function showRecipeDetail(index) {
      const item = currentDataSet[index];
      if (!item) return;

      document.getElementById('modal-title').textContent = item.name;
      document.getElementById('modal-badge').textContent = item.category;
      document.getElementById('modal-desc').textContent = item.description;

      const stepsList = document.getElementById('modal-steps');
      stepsList.innerHTML = '';

      if (Array.isArray(item.steps) && item.steps.length > 0) {
        item.steps.forEach(step => {
          const li = document.createElement('li');
          li.textContent = step;
          stepsList.appendChild(li);
        });
      } else {
        stepsList.innerHTML = '<li>Instruksi memasak belum tersedia.</li>';
      }

      document.getElementById('recipe-modal').classList.add('active');
    }

    // Tutup Modal
    function closeModal() {
      document.getElementById('recipe-modal').classList.remove('active');
    }

      if (matchedKey && db[matchedKey]) {
        const targetData = db[matchedKey];
        currentDataSet = targetData.items || [];
        appTitle.textContent = `20 Variasi Olahan Kuliner Berbahan ${escapeHTML(targetData.ingredient)}`;
        appSubtitle.textContent = `Menampilkan total ${currentDataSet.length} resep masakan dan camilan realistis beserta cara memasaknya.`;
        renderTable(currentDataSet);
      } else {
        currentDataSet = [];
        appTitle.textContent = `Katalog Olahan Kuliner`;
        appSubtitle.textContent = `Pencarian resep untuk bahan "${escapeHTML(queryInput)}"`;
        renderTable([]);
      }
    }

    // Inisialisasi Event Listener
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-search').addEventListener('click', executeSearch);
      document.getElementById('btn-close-modal').addEventListener('click', closeModal);
      
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') executeSearch();
      });

      document.getElementById('recipe-modal').addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-overlay')) closeModal();
      });

      // Jalankan pencarian awal
      executeSearch();
    });
  </script>
</body>
</html>
